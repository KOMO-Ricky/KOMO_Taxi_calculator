<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  :root{
    --navy:#1a2b57; --navy-d:#131f40; --yellow:#ffc93c; --cream:#f5edDC;
    --brown:#5b3a29; --red:#c24a2e;
  }
  body{
    font-family:'Pretendard','Malgun Gothic',sans-serif;
    background:#f5edda;
    background-image:radial-gradient(rgba(91,58,41,.055) 1.6px,transparent 1.6px);
    background-size:26px 26px;
    color:var(--navy);position:relative;overflow:hidden;
  }
  .frame{position:absolute;inset:26px;border:2.5px solid var(--navy);border-radius:8px;pointer-events:none;}
  .frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(26,43,87,.35);border-radius:5px;}
  .wrap{position:relative;height:100%;padding:66px 86px 64px;display:flex;flex-direction:column;}

  /* 상단 */
  .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .org{display:flex;align-items:center;gap:16px;}
  .bar{width:2.5px;height:34px;background:rgba(26,43,87,.4);border-radius:2px;}
  .orgname{font-size:27px;font-weight:800;color:var(--navy);letter-spacing:-.5px;}
  .logo2{text-align:right;}
  .logo2 small{display:block;font-size:18px;font-weight:600;color:#6b7694;margin-top:9px;letter-spacing:0;}
  .sticker{
    position:absolute;right:-16px;top:25%;z-index:3;
    transform:rotate(7deg);background:var(--yellow);color:var(--navy-d);
    font-weight:800;font-size:22px;padding:10px 20px;border-radius:999px;
    box-shadow:5px 5px 0 rgba(26,43,87,.2);border:2px solid var(--navy);
  }

  /* 킥커 + 헤드라인 */
  .kicker{margin-top:46px;text-align:center;font-weight:800;font-size:27px;letter-spacing:6px;color:var(--brown);}
  .kicker:before,.kicker:after{content:'—————';letter-spacing:0;color:rgba(91,58,41,.4);margin:0 18px;}
  .head{
    margin-top:56px;text-align:center;font-family:'Black Han Sans','Malgun Gothic',sans-serif;
    font-size:86px;line-height:1.2;letter-spacing:0;font-weight:400;position:relative;
  }
  .head .hl{background:linear-gradient(transparent 58%, var(--yellow) 58%);padding:0 6px;}

  /* 쿠폰 티켓 */
  .ticket{
    margin:30px auto 0;width:860px;height:264px;background:#fffdf6;border-radius:20px;position:relative;
    border:2.5px solid var(--navy);box-shadow:10px 10px 0 rgba(26,43,87,.15);
    display:flex;align-items:center;
  }
  .ticket .hole{position:absolute;width:44px;height:44px;border-radius:50%;background:#f5edda;border:2.5px solid var(--navy);top:50%;transform:translateY(-50%);}
  .hole.l{left:-24px;border-left-color:transparent;}
  .hole.r{right:-24px;border-right-color:transparent;}
  .t-left{flex:0 0 250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .t-left .fc{font-weight:800;font-size:19px;letter-spacing:4px;color:var(--brown);}
  .t-mid{flex:1;padding-left:8px;}
  .t-mid .big{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-size:50px;color:var(--navy);line-height:1.22;white-space:nowrap;}
  .t-mid .big em{font-style:normal;color:var(--red);}
  .t-mid .sub{margin-top:10px;font-size:26px;font-weight:700;color:#5d6882;}
  .t-cut{flex:0 0 0;border-left:3px dashed rgba(26,43,87,.45);height:76%;margin:0 30px 0 10px;}
  .t-right{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:14px;padding-right:34px;}
  .t-right .co{font-weight:800;letter-spacing:5px;font-size:18px;color:var(--navy);writing-mode:vertical-rl;}
  .barcode{width:58px;height:120px;background:repeating-linear-gradient(to bottom,var(--navy-d) 0 3px,transparent 3px 7px,var(--navy-d) 7px 12px,transparent 12px 15px);}

  /* 기간 · 업데이트 */
  .period{margin-top:auto;text-align:center;font-size:47px;font-weight:800;}
  .period .d{color:var(--red);}
  .chips{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:nowrap;}
  .chip{
    border:2px solid var(--navy);border-radius:999px;background:#fffdf6;
    font-size:22px;font-weight:800;padding:10px 16px;color:var(--navy);box-shadow:3px 3px 0 rgba(26,43,87,.1);white-space:nowrap;
  }
  .chip b{color:var(--brown);}
  .chips-cap{margin-top:12px;text-align:center;font-size:21px;font-weight:600;color:#6b7694;letter-spacing:1px;}

  /* 참여 방법 */
  .how{
    margin-top:auto;background:#fffdf6;border:2.5px solid var(--navy);border-radius:18px;
    padding:32px 44px 28px;box-shadow:7px 7px 0 rgba(26,43,87,.12);
  }
  .how h3{font-size:29px;font-weight:800;margin-bottom:18px;}
  .how h3 span{color:var(--brown);font-size:23px;font-weight:700;}
  .row{display:flex;align-items:center;gap:16px;margin-bottom:13px;}
  .row:last-of-type{margin-bottom:0;}
  .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;}
  .row .t{font-size:30px;font-weight:700;}
  .warn{margin-top:18px;font-size:24px;font-weight:800;color:var(--red);text-align:left;padding-left:56px;}

  /* 하단 */
  .cta{
    margin-top:auto;background:var(--navy);border-radius:16px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:26px 40px;
    box-shadow:7px 7px 0 rgba(26,43,87,.18);
  }
  .cta .go{font-size:27px;font-weight:700;color:#cdd9f5;}
  .cta .url{font-size:36px;font-weight:800;color:var(--yellow);letter-spacing:.5px;}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="top">
      <div class="org"><img src="logo/logo_kola.png" style="height:40px;display:block;"><span class="bar"></span><span class="orgname">개인택시 양수도센터</span></div>
      <div class="logo2"><img src="logo/logo_brand_light.png" style="height:36px;display:block;margin-left:auto;"><small>개인택시 준비자금 계산기</small></div>
    </div>

    <div class="kicker">10월 업데이트 기념 이벤트</div>
    <div class="chips">
      <div class="chip">✓ 트림별 가격 자동 반영</div>
      <div class="chip">✓ 세부 옵션 직접 선택</div>
      <div class="chip">✓ 미터점 작업비 최신화</div>
    </div>
    <div class="head">매일 10분께<br><span class="hl">커피 쿠폰</span>을 드립니다<div class="sticker">이용자 2,000명 돌파 🎉</div></div>

    <div class="period"><span class="d">10월 2일(금) ~ 10월 8일(목)</span></div>


    <div class="how">
      <h3>참여 방법 <span>· 30초면 끝</span></h3>
      <div class="row"><div class="n">1</div><div class="t">계산기에서 준비자금 견적 비교하기</div></div>
      <div class="row"><div class="n">2</div><div class="t">화면 하단에서 [의견 보내기]</div></div>
      <div class="row"><div class="n">3</div><div class="t">의견 제출 시 전화번호 입력하기</div></div>
      <div class="warn">⚠ 전화번호 미입력 시 당첨되어도 쿠폰을 보내드릴 수 없어요</div>
    </div>

    <div class="cta">
      <div class="go">지금 바로 참여하러 가기 👉</div>
      <div class="url">calculator.licen.co.kr</div>
    </div>
  </div>
</body>
</html>
