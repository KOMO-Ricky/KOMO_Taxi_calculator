<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MyTaxiPlan 아웃트로</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif; position:relative;
         background:#0C1B3D; }
  #closing { position:absolute; inset:0; display:flex; flex-direction:column;
             justify-content:center; align-items:center; text-align:center; }
  #closing .c-logo { font-weight:800; font-size:112px; color:#FFC72C; letter-spacing:-0.01em; }
  #closing .c-kr { font-weight:700; font-size:50px; color:#fff; margin-top:16px; }
  #closing .c-naver { display:flex; align-items:center; gap:20px; margin-top:76px; opacity:0; }
  #closing .nv-pre, #closing .nv-post { color:#fff; font-weight:700; font-size:42px; }
  #closing .nv-box { display:flex; align-items:center; gap:14px; background:#fff; border:3px solid #03C75A;
                     border-radius:999px; padding:18px 26px; color:#0C1B3D; font-weight:800; font-size:40px; }
  #closing .nv-n { width:40px; height:40px; }
  #closing .nv-mag { width:36px; height:36px; margin-left:4px; }
  #closing .c-url { font-weight:700; font-size:36px; color:#B9C4DC; margin-top:40px;
                    background:rgba(255,255,255,.06); border:2px solid rgba(255,199,44,.45);
                    border-radius:999px; padding:16px 40px; opacity:0; }
  #closing .c-org { display:flex; align-items:center; gap:18px; margin-top:92px; opacity:0; }
  #closing .kola-img { height:68px; width:auto; }
  #closing .kola-t { color:#fff; font-weight:700; font-size:42px; }
  #closing .c-op { margin-top:32px; color:#8FA0C4; font-size:32px; font-weight:500;
                   line-height:1.65; text-align:center; opacity:0; }
  #closing .c-op b { color:#C9D4EA; }
</style>
</head>
<body>
<div id="closing">
  <div class="c-logo">MyTaxiPlan</div>
  <div class="c-kr">개인택시 준비자금 계산기</div>
  <div class="c-naver"><span class="nv-pre">네이버에</span><span class="nv-box"><svg class="nv-n" viewBox="0 0 24 24"><path fill="#03C75A" d="M16.3 3v9.6L7.7 3H3v18h4.7v-9.6L16.3 21H21V3z"/></svg>개인택시 양수도센터<svg class="nv-mag" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#03C75A" stroke-width="2.6"/><line x1="15.6" y1="15.6" x2="21" y2="21" stroke="#03C75A" stroke-width="2.8" stroke-linecap="round"/></svg></span><span class="nv-post">를 검색하세요</span></div>
  <div class="c-org"><img class="kola-img" src="kola_logo.png" alt="KOLA"><span class="kola-t">개인택시 양수도센터</span></div>
  <div class="c-op">개인택시 양수도센터는 모빌리티 전문 기업<br><b>한국모빌리티연구소</b>가 운영하는 대한민국 No.1 면허 중개 센터입니다</div>
  <div class="c-url">calculator.licen.co.kr</div>
</div>

<script>
const TOTAL = 5.0;
const $ = (s) => document.querySelector(s);
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));
const lerp = (a,b,t) => a+(b-a)*t;
const easeOutCubic = (t) => 1-Math.pow(1-t,3);
const easeOutBack = (t) => { const c=1.70158; return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };

async function SEEK(t) {
  t = clamp(t, 0, TOTAL-0.001);
  const cl = $('#closing');
  cl.style.opacity = clamp(t/0.45, 0, 1);
  const k = easeOutBack(clamp(t/0.9, 0, 1));
  cl.querySelector('.c-logo').style.transform = `scale(${lerp(0.7, 1, k)})`;
  const u = cl.querySelector(".c-naver");
  const k2 = easeOutCubic(clamp((t-0.5)/0.6, 0, 1));
  u.style.opacity = k2; u.style.transform = `translateY(${lerp(40,0,k2)}px)`;
  const late = clamp((t-0.9)/0.5, 0, 1);
  cl.querySelectorAll(".c-org,.c-op,.c-url").forEach(n => n.style.opacity = late);
  return 'ok';
}

window.READY = (async () => {
  await document.fonts.ready;
  const im = document.querySelector('.kola-img');
  if (!im.complete) await new Promise(r => { im.onload = r; im.onerror = r; });
  await SEEK(0);
  return 'ready';
})();
window.SEEK = SEEK;
window.TOTAL = TOTAL;
</script>
</body>
</html>
