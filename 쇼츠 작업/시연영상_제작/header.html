<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
  body { font-family:'Pretendard Variable', Pretendard, sans-serif; }
  #wrap { position:absolute; left:0; top:52px; width:1080px; text-align:center; }
  .row { display:flex; align-items:center; justify-content:center; gap:18px; }
  .row img { height:62px; width:auto; filter:drop-shadow(0 2px 6px rgba(10,18,40,.55)); }
  .row .t { color:#fff; font-weight:800; font-size:54px; letter-spacing:-0.01em;
    text-shadow:-3px -3px 0 #16264E, 3px -3px 0 #16264E, -3px 3px 0 #16264E, 3px 3px 0 #16264E,
                 0 -4px 0 #16264E, 0 4px 0 #16264E, -4px 0 0 #16264E, 4px 0 0 #16264E,
                 0 6px 14px rgba(10,18,40,.5); }
  .panel { display:inline-block; margin-top:26px; background:rgba(22,38,78,.93);
    border-radius:26px; padding:30px 54px 34px;
    box-shadow:0 10px 30px rgba(10,18,40,.35); }
  .panel .l1 { color:#FFC72C; font-weight:800; font-size:82px; line-height:1.18; letter-spacing:-0.01em; }
  .panel .l2 { color:#fff; font-weight:800; font-size:72px; line-height:1.2; letter-spacing:-0.01em; }
</style>
</head>
<body>
<div id="wrap">
  <div class="row"><img src="kola_logo.png" alt="KOLA"><span class="t">개인택시양수도센터</span></div>
  <div class="panel"><div class="l1">개인택시 창업비용</div><div class="l2">얼마나 들까?</div></div>
</div>
</body>
</html>
